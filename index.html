<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>종목추천</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* iOS 시스템 색 (Human Interface Guidelines). 한국 시장 관례: 상승 빨강, 하락 파랑 */
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --cell-press:#E5E5EA;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.16);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --gray:#8E8E93;
  --up:#FF3B30; --down:#007AFF;
  --bar:rgba(249,249,249,.82); --sheet:#FFFFFF; --dim:rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --cell:#1C1C1E; --cell-press:#2C2C2E;
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.65); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.32);
    --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --gray:#8E8E93;
    --up:#FF453A; --down:#0A84FF;
    --bar:rgba(22,22,24,.82); --sheet:#1C1C1E; --dim:rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* 내비게이션 막대: 스크롤하면 작은 제목과 흐린 배경 */
.navbar{position:sticky;top:0;z-index:5;height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:transparent;transition:background .2s}
.navbar .small-title{grid-column:2;font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap}
.navbar .mode{grid-column:3;justify-self:end;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;
  background:var(--fill);color:var(--label2);white-space:nowrap}
.navbar .mode.real{background:var(--red);color:#fff}
.navbar.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 .5px 0 var(--sep)}
.navbar.scrolled .small-title{opacity:1}
main{max-width:680px;margin:0 auto;padding:0 0 calc(96px + env(safe-area-inset-bottom))}
.large-title{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 16px 8px;line-height:1.2}

/* 묶음 목록 (inset grouped) */
.sec-head{font-size:13px;color:var(--label2);margin:22px 32px 7px;text-transform:none}
.sec-foot{font-size:13px;color:var(--label2);margin:7px 32px 0;line-height:1.4}
.group{background:var(--cell);border-radius:12px;margin:0 16px;overflow:hidden}
.group + .group{margin-top:14px}
.cell{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;background:var(--cell)}
.cell + .cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.cell.indent + .cell.indent::before{left:58px}
.cell .grow{flex:1;min-width:0}
.cell .sub{font-size:13px;color:var(--label2);margin-top:2px}
.cell .val{color:var(--label2);text-align:right;white-space:nowrap}
.cell.tap{cursor:pointer;user-select:none}
.cell.tap:active{background:var(--cell-press)}
.cell.action{color:var(--blue);cursor:pointer}
.cell.action:active{background:var(--cell-press)}
.cell.action.destructive{color:var(--red)}
.cell.action[aria-disabled="true"]{color:var(--label3);pointer-events:none}
.chev{width:8px;height:13px;flex:none;color:var(--label3)}
.title17{font-size:17px;font-weight:600}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 추천 카드 */
.pick-head{padding-top:13px;padding-bottom:13px}
.checkcircle{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--label3);display:grid;place-items:center;transition:all .15s}
.checkcircle svg{width:14px;height:14px;opacity:0;color:#fff}
input.pick{position:absolute;opacity:0;pointer-events:none}
input.pick:checked + .checkcircle{background:var(--blue);border-color:var(--blue)}
input.pick:checked + .checkcircle svg{opacity:1}
input.pick:disabled + .checkcircle{opacity:.35}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;padding:12px 16px 14px}
.metric .k{font-size:12px;color:var(--label2)}
.metric .v{font-size:17px;font-weight:600;margin-top:2px}
.up{color:var(--up)} .down{color:var(--down)}

/* 알약 표시 */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;
  background:var(--fill);color:var(--label2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pill.warn{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.pill.bad{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--gray)}
.dot.ok{background:var(--green)} .dot.warn{background:var(--orange)} .dot.bad{background:var(--red)}

/* 안내 줄 */
.notice{display:flex;gap:10px;align-items:flex-start;margin:10px 16px 0;padding:12px 14px;border-radius:12px;background:var(--cell);font-size:15px}
.notice .ic{width:20px;height:20px;flex:none;margin-top:1px}
.notice.warn .ic{color:var(--orange)} .notice.bad .ic{color:var(--red)} .notice.info .ic{color:var(--blue)} .notice.ok .ic{color:var(--green)}

/* 버튼 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 32px);margin:16px 16px 0;height:50px;border:0;border-radius:14px;
  background:var(--blue);color:#fff;font-size:17px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.98);opacity:.85}
.btn:disabled{background:var(--fill2);color:var(--label3);cursor:not-allowed;transform:none}
.btn.tinted{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}

/* 입력 */
.field{width:100%;border:0;outline:0;background:transparent;color:var(--label);font:inherit;padding:0;min-width:0}
.field::placeholder{color:var(--label3)}

/* 토글 스위치 */
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--fill2);transition:background .2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s cubic-bezier(.3,.7,.4,1)}
.switch input:checked + span{background:var(--green)}
.switch input:checked + span::after{transform:translateX(20px)}

/* 펼치기 */
details.group summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;cursor:pointer}
details.group summary::-webkit-details-marker{display:none}
details.group summary .chev{margin-left:auto;transition:transform .2s}
details.group[open] summary .chev{transform:rotate(90deg)}
details.group .body{padding:0 16px 14px}
pre{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;margin:0;color:var(--label)}
ol.steps{padding-left:20px;margin:4px 0;font-size:15px} ol.steps li{margin:6px 0}

/* 비어 있음·불러오는 중 */
.empty{text-align:center;padding:36px 24px;color:var(--label2);font-size:15px}
.empty .big{font-size:20px;font-weight:600;color:var(--label);margin-bottom:6px}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--fill2);border-top-color:var(--label2);
  animation:s .8s linear infinite;vertical-align:-3px} @keyframes s{to{transform:rotate(360deg)}}

/* 탭 막대 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep)}
nav button{background:none;border:0;color:var(--gray);font-size:10.5px;font-weight:500;display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:2px 0;cursor:pointer}
nav button svg{width:26px;height:26px}
nav button[aria-current="page"]{color:var(--blue)}

/* 아래에서 올라오는 시트 */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:680px;background:transparent;color:var(--label);overflow:visible}
dialog::backdrop{background:var(--dim);animation:fade .2s}
dialog[open] .sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}} @keyframes fade{from{opacity:0}}
.sheet{background:var(--sheet);border-radius:14px 14px 0 0;padding:8px 0 calc(16px + env(safe-area-inset-bottom))}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 12px}
.sheet h2{font-size:20px;font-weight:700;margin:4px 20px 12px}
.sheet .group{background:var(--bg)}
.sheet .cell{background:transparent}
.sheet .sec-foot{margin:8px 20px 0}
.sheet .btns{display:flex;flex-direction:column;gap:8px;margin:16px 16px 0}
.sheet .btns .btn{margin:0;width:100%}
.sheet .btns .btn.plain{background:transparent;color:var(--blue);font-weight:400}
</style>
</head>
<body>
<header class="navbar" id="navbar"><span class="small-title" id="smallTitle"></span><span id="mode" class="mode">…</span></header>
<main><h1 class="large-title" id="title">오늘 추천</h1><div id="view"></div></main>
<nav id="nav"></nav>
<dialog id="dlg"><div class="sheet"><div class="grabber"></div><div id="dlgBody"></div>
  <div class="btns"><button class="btn" id="dlgYes">확인</button><button class="btn plain" id="dlgNo">취소</button></div></div></dialog>

<script>
"use strict";
const REPO = "ysjang1972/stock-pick";
const API = "https://api.github.com/repos/" + REPO;
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = v => v == null || v === "" || isNaN(v) ? "-" : Math.round(+v).toLocaleString("ko-KR");
const kstToday = () => new Date().toLocaleDateString("sv-SE", {timeZone: "Asia/Seoul"}).replaceAll("-", "");
const fmtDate = d => d ? `${+d.slice(4,6)}월 ${+d.slice(6,8)}일` : "";
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "방금" : m < 60 ? `${m}분 전` : m < 1440 ? `${Math.round(m/60)}시간 전` : `${Math.round(m/1440)}일 전`; };

// ---------------------------------------------------------------- 아이콘 (SF Symbols 느낌의 선 아이콘)
const SVG = (p, vb = "0 0 24 24") => `<svg viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  chev: `<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  check: `<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.3 5.8 10 11 4.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  warn: SVG('<path d="M12 3.5 2.8 19.5h18.4L12 3.5z"/><path d="M12 10v4.2M12 17.2v.1"/>'),
  info: SVG('<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8v.1"/>'),
  ok: SVG('<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16 9.5"/>'),
};
const TAB = {
  today: ['<path d="M4 20V10M9.3 20V5M14.6 20v-7M20 20V8"/>', '<rect x="3" y="9" width="3" height="11" rx="1" fill="currentColor"/><rect x="8.3" y="4" width="3" height="16" rx="1" fill="currentColor"/><rect x="13.6" y="12" width="3" height="8" rx="1" fill="currentColor"/><rect x="18.9" y="7" width="3" height="13" rx="1" fill="currentColor"/>'],
  orders: ['<rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/>', '<rect x="5" y="3.5" width="14" height="17" rx="2.5" fill="currentColor"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4" style="stroke:var(--cell)"/>'],
  account: ['<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18M15.5 15h2.5"/>', '<rect x="3" y="6" width="18" height="13" rx="2.5" fill="currentColor"/><path d="M3 10.5h18M15.5 15h2.5" style="stroke:var(--cell)"/>'],
  runs: ['<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', '<circle cx="12" cy="12" r="9" fill="currentColor"/><path d="M12 7.5V12l3 2" style="stroke:var(--cell)"/>'],
  settings: ['<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>', null],
};

// ---------------------------------------------------------------- GitHub API
class ApiError extends Error { constructor(status, msg){ super(msg); this.status = status; } }
function token(){ return store.get("gh_token") || ""; }
async function gh(path, opts = {}){
  const r = await fetch(API + path, {cache: "no-store", ...opts, headers: {
    "Authorization": "Bearer " + token(), "Accept": opts.accept || "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? {"Content-Type": "application/json"} : {})}});
  if (r.status === 401) throw new ApiError(401, "토큰이 틀렸거나 만료됐습니다. 설정에서 다시 넣어 주세요.");
  if (!r.ok && r.status !== 404) {
    let msg = ""; try { msg = (await r.json()).message || ""; } catch {}
    if (r.status === 403 && /rate limit/i.test(msg)) msg = "GitHub 호출 한도에 걸렸습니다. 잠시 뒤 다시 시도하세요.";
    else if (r.status === 403) msg = "토큰 권한이 부족합니다 (Contents 읽기, Actions 읽기·쓰기 필요).";
    throw new ApiError(r.status, msg || `GitHub 오류 ${r.status}`);
  }
  return r;
}
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
async function raw(path){
  const r = await gh("/contents/" + encPath(path) + "?ref=main", {accept: "application/vnd.github.raw+json"});
  if (r.status === 404) return null;
  return (await r.text()).replace(/^﻿/, "");
}
async function json(path){ const t = await raw(path); return t == null ? null : JSON.parse(t); }
async function list(dir){
  const r = await gh("/contents/" + encPath(dir) + "?ref=main");
  if (r.status === 404) return [];
  return await r.json();
}
async function latest(dir, prefix){
  const files = (await list(dir)).filter(f => f.type === "file" && f.name.startsWith(prefix) && !f.name.includes("_시험"));
  files.sort((a, b) => a.name < b.name ? 1 : -1);
  return files[0] || null;
}
async function dispatch(wf, inputs = {}){
  const r = await gh(`/actions/workflows/${wf}/dispatches`, {method: "POST", body: JSON.stringify({ref: "main", inputs})});
  if (r.status === 404) throw new ApiError(404, "워크플로를 찾지 못했거나 토큰에 Actions 쓰기 권한이 없습니다.");
}
async function runs(wf, n = 10){
  const r = await gh((wf ? `/actions/workflows/${wf}/runs` : "/actions/runs") + `?per_page=${n}`);
  return r.status === 404 ? [] : (await r.json()).workflow_runs || [];
}
function parseCsv(t){
  const lines = (t || "").trim().split(/\r?\n/).filter(Boolean);
  if (lines.length < 2) return [];
  const head = lines[0].split(",");
  return lines.slice(1).map(l => { const c = l.split(","); return Object.fromEntries(head.map((h, i) => [h, c[i]])); });
}

// ---------------------------------------------------------------- 공용 UI
function confirmBox(html, yes = "확인"){
  return new Promise(res => {
    const d = $("#dlg"); $("#dlgBody").innerHTML = html; $("#dlgYes").textContent = yes;
    const done = v => { d.close(); $("#dlgYes").onclick = $("#dlgNo").onclick = d.onclick = null; res(v); };
    $("#dlgYes").onclick = () => done(true); $("#dlgNo").onclick = () => done(false);
    d.onclick = e => { if (e.target === d) done(false); };      // 시트 밖을 누르면 닫기
    d.oncancel = () => done(false); d.showModal();
  });
}
const notice = (kind, html) => `<div class="notice ${kind}"><span class="ic">${I[kind === "bad" ? "warn" : kind] || I.info}</span><div>${html}</div></div>`;
function errorCard(e){
  return notice("bad", esc(e.message || e)) +
    (e.status === 401 ? `<div class="group" style="margin-top:10px"><div class="cell action" onclick="go('settings')">설정으로 이동</div></div>` : "");
}
const loading = msg => `<div class="empty"><span class="spin"></span>&nbsp; ${esc(msg || "불러오는 중")}</div>`;
const runPill = r => r.status !== "completed" ? `<span class="pill warn"><span class="spin" style="width:11px;height:11px;border-width:1.5px"></span>실행 중</span>`
  : r.conclusion === "success" ? `<span class="pill ok">성공</span>`
  : r.conclusion === "cancelled" ? `<span class="pill">취소</span>` : `<span class="pill bad">실패</span>`;
const statusKind = s => /^체결/.test(s) ? "ok" : /^(주문됨|승인)/.test(s) ? "warn" : /^(실패|건너뜀|미체결)/.test(s) ? "bad" : "";
const statusPill = s => `<span class="pill ${statusKind(s)}">${esc(s.length > 14 ? s.slice(0, 14) + "…" : s)}</span>`;

let MODE = null;
async function loadMode(){
  try {
    const cfg = await raw("config.yaml") || "";
    const m = cfg.match(/^\s*mode:\s*(\w+)/m);
    MODE = m ? m[1] : "paper";
    const el = $("#mode"); el.textContent = MODE === "real" ? "실전투자" : "모의투자"; el.className = "mode" + (MODE === "real" ? " real" : "");
  } catch { $("#mode").textContent = "연결 안 됨"; }
}
const modeName = () => MODE === "real" ? "실전투자" : "모의투자";

// ---------------------------------------------------------------- 화면: 오늘 추천
async function viewToday(v){
  v.innerHTML = loading();
  const [picks, file] = await Promise.all([json("results/latest_picks.json"), latest("results", "추천_")]);
  const today = kstToday();

  const events = () => [...el.querySelectorAll(".ev:checked")].map(c => c.value);
  $("#pushSave").onclick = async () => {
    const ev = events(); if (!ev.length) { msg(notice("warn", "알림 받을 일을 하나 이상 고르세요.")); return; }
    msg(loading("알림 등록 중"));
    try {
      if (await Notification.requestPermission() !== "granted") { msg(notice("bad", "알림 권한을 허용해야 합니다.")); return; }
      const key = ((await raw("notify/vapid_public.txt")) || "").trim();
      if (!key) {
        await dispatch("notify.yml", {action: "init"});
        msg(notice("warn", "알림을 처음 준비하고 있습니다. 1분쯤 뒤 다시 '알림 켜기'를 눌러 주세요.")); return;
      }
      const [reg, old] = await pushSub();
      const s = old || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64u(key)});
      const dev = (navigator.userAgentData && navigator.userAgentData.platform) || "휴대폰";
      await dispatch("notify.yml", {action: "subscribe", subscription: JSON.stringify(s.toJSON()), events: ev.join(","), device: dev});
      store.set("push_on", "1"); store.set("push_events", JSON.stringify(ev));
      msg(notice("ok", "등록을 요청했습니다. 1분쯤 뒤 '알림이 켜졌습니다' 알림이 오면 완료입니다."));
      setTimeout(() => current === "settings" && pushCard(el), 2500);
    } catch (e) { msg(errorCard(e)); }
  };
  const t = $("#pushTest"); if (t) t.onclick = async () => {
    try { const [, s] = await pushSub(); await dispatch("notify.yml", {action: "test", subscription: JSON.stringify(s.toJSON())});
      msg(notice("ok", "시험 알림을 요청했습니다. 1분 안에 옵니다.")); } catch (e) { msg(errorCard(e)); }
  };
  const off = $("#pushOff"); if (off) off.onclick = async () => {
    try { const [, s] = await pushSub();
      if (s) { await dispatch("notify.yml", {action: "unsubscribe", subscription: JSON.stringify(s.toJSON())}); await s.unsubscribe(); }
      store.set("push_on", null); pushCard(el);
    } catch (e) { msg(errorCard(e)); }
  };
}

// ---------------------------------------------------------------- 탭
const VIEWS = {today: ["오늘 추천", "추천", viewToday], orders: ["주문", "주문", viewOrders], account: ["계좌", "계좌", viewAccount],
               runs: ["실행 기록", "실행", viewRuns], settings: ["설정", "설정", viewSettings]};
const urlTab = new URLSearchParams(location.search).get("tab");
let current = (urlTab && urlTab in VIEWS) ? urlTab : (store.get("tab") || "today");
if (urlTab) history.replaceState(null, "", location.pathname);
function go(tab){ current = tab; store.set("tab", tab); render(); window.scrollTo(0, 0); }
async function render(){
  clearTimeout(window._poll);
  if (!token() && current !== "settings") current = "settings";
  $("#nav").innerHTML = Object.entries(VIEWS).map(([k, [, label]]) => {
    const [line, fill] = TAB[k], active = k === current;
    return `<button ${active ? 'aria-current="page"' : ""} onclick="go('${k}')">${SVG(active && fill ? fill : line)}${label}</button>`;
  }).join("");
  const [title, , fn] = VIEWS[current]; $("#title").textContent = title; $("#smallTitle").textContent = title;
  const v = $("#view");
  try { await fn(v); } catch (e) { v.innerHTML = errorCard(e); }
}
const onScroll = () => $("#navbar").classList.toggle("scrolled", window.scrollY > 36);
window.addEventListener("scroll", onScroll, {passive: true});
document.addEventListener("visibilitychange", () => { if (!document.hidden && token()) render(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (token()) loadMode(); else $("#mode").textContent = "연결 전";
render();
</script>
