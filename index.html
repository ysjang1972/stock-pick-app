<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>종목추천</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#14171c; --muted:#5f6670; --line:#e3e6ea;
  --accent:#1f6feb; --accent-text:#ffffff; --up:#d1242f; --down:#0a62d0; --ok:#1a7f37; --warn:#9a6700;
  --chip:#eef1f5; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa2ad; --line:#2a2f37;
    --accent:#4c8dff; --accent-text:#0b0d10; --up:#ff6b6b; --down:#6ea8ff; --ok:#3fb950; --warn:#d29922;
    --chip:#232831; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:20px;margin:0;font-weight:700}
.mode{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.mode.real{background:var(--up);color:#fff}
main{padding:0 16px calc(84px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:8px 0 10px;display:flex;
  flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin-top:8px}
.grid div{display:flex;justify-content:space-between;gap:6px;font-size:14px}
.grid span:first-child{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.name{font-size:17px;font-weight:700}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.up{color:var(--up)} .down{color:var(--down)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;cursor:pointer;
  background:var(--accent);color:var(--accent-text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn+.btn{margin-top:8px}
.banner{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;background:var(--chip)}
.banner.warn{background:color-mix(in srgb,var(--warn) 18%,transparent)}
.banner.bad{background:color-mix(in srgb,var(--up) 14%,transparent)}
pre{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;margin:0}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
input[type=password],input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font:inherit}
.check{display:flex;gap:12px;align-items:flex-start}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent);flex:none}
.empty{text-align:center;padding:28px 8px;color:var(--muted)}
.list>div{padding:10px 0;border-top:1px solid var(--line)} .list>div:first-child{border-top:0}
table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;border-top:0}
dialog{border:0;border-radius:16px;padding:18px;max-width:420px;width:calc(100% - 32px);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;
  animation:s 1s linear infinite;vertical-align:-2px} @keyframes s{to{transform:rotate(360deg)}}
ol.steps{padding-left:20px;margin:6px 0} ol.steps li{margin:4px 0}
</style>
</head>
<body>
<header><h1 id="title">오늘 추천</h1><span id="mode" class="mode">…</span></header>
<main id="view"></main>
<nav id="nav"></nav>
<dialog id="dlg"><div id="dlgBody"></div><div style="display:flex;gap:8px;margin-top:14px">
  <button class="btn ghost" id="dlgNo" style="margin:0">취소</button><button class="btn" id="dlgYes" style="margin:0">확인</button></div></dialog>

<script>
"use strict";
const REPO = "ysjang1972/stock-pick";
const API = "https://api.github.com/repos/" + REPO;
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = v => v == null || v === "" || isNaN(v) ? "-" : Math.round(+v).toLocaleString("ko-KR");
const pct = v => v == null || v === "" || isNaN(v) ? "-" : (v > 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
const kstToday = () => new Date().toLocaleDateString("sv-SE", {timeZone: "Asia/Seoul"}).replaceAll("-", "");
const fmtDate = d => d ? `${d.slice(4,6)}/${d.slice(6,8)}` : "";
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "방금" : m < 60 ? `${m}분 전` : m < 1440 ? `${Math.round(m/60)}시간 전` : `${Math.round(m/1440)}일 전`; };

// ---------------------------------------------------------------- GitHub API
class ApiError extends Error { constructor(status, msg){ super(msg); this.status = status; } }
function token(){ return store.get("gh_token") || ""; }
async function gh(path, opts = {}){
  const r = await fetch(API + path, {cache: "no-store", ...opts, headers: {
    "Authorization": "Bearer " + token(), "Accept": opts.accept || "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? {"Content-Type": "application/json"} : {})}});
  if (r.status === 401) throw new ApiError(401, "토큰이 틀렸거나 만료됐습니다. 설정에서 다시 넣어 주세요.");
  if (!r.ok && r.status !== 404) {
    let msg = ""; try { msg = (await r.json()).message || ""; } catch {}
    if (r.status === 403 && /rate limit/i.test(msg)) msg = "GitHub 호출 한도에 걸렸습니다. 잠시 뒤 다시 시도하세요.";
    else if (r.status === 403) msg = "토큰 권한이 부족합니다 (Contents 읽기, Actions 읽기·쓰기 필요).";
    throw new ApiError(r.status, msg || `GitHub 오류 ${r.status}`);
  }
  return r;
}
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
async function raw(path){
  const r = await gh("/contents/" + encPath(path) + "?ref=main", {accept: "application/vnd.github.raw+json"});
  if (r.status === 404) return null;
  return (await r.text()).replace(/^﻿/, "");
}
async function json(path){ const t = await raw(path); return t == null ? null : JSON.parse(t); }
async function list(dir){
  const r = await gh("/contents/" + encPath(dir) + "?ref=main");
  if (r.status === 404) return [];
  return await r.json();
}
async function latest(dir, prefix){
  const files = (await list(dir)).filter(f => f.type === "file" && f.name.startsWith(prefix) && !f.name.includes("_시험"));
  files.sort((a, b) => a.name < b.name ? 1 : -1);
  return files[0] || null;
}
async function dispatch(wf, inputs = {}){
  const r = await gh(`/actions/workflows/${wf}/dispatches`, {method: "POST", body: JSON.stringify({ref: "main", inputs})});
  if (r.status === 404) throw new ApiError(404, "워크플로를 찾지 못했거나 토큰에 Actions 쓰기 권한이 없습니다.");
}
async function runs(wf, n = 10){
  const r = await gh((wf ? `/actions/workflows/${wf}/runs` : "/actions/runs") + `?per_page=${n}`);
  return r.status === 404 ? [] : (await r.json()).workflow_runs || [];
}
function parseCsv(t){
  const lines = (t || "").trim().split(/\r?\n/).filter(Boolean);
  if (lines.length < 2) return [];
  const head = lines[0].split(",");
  return lines.slice(1).map(l => { const c = l.split(","); return Object.fromEntries(head.map((h, i) => [h, c[i]])); });
}

// ---------------------------------------------------------------- 공용 UI
function confirmBox(html, yes = "확인"){
  return new Promise(res => {
    const d = $("#dlg"); $("#dlgBody").innerHTML = html; $("#dlgYes").textContent = yes;
    const done = v => { d.close(); $("#dlgYes").onclick = $("#dlgNo").onclick = null; res(v); };
    $("#dlgYes").onclick = () => done(true); $("#dlgNo").onclick = () => done(false);
    d.oncancel = () => done(false); d.showModal();
  });
}
function errorCard(e){
  return `<div class="banner bad">${esc(e.message || e)}</div>` +
    (e.status === 401 ? `<button class="btn ghost" onclick="go('settings')">설정으로</button>` : "");
}
const loading = msg => `<div class="empty"><span class="spin"></span> ${esc(msg || "불러오는 중")}</div>`;
const runChip = r => r.status !== "completed" ? `<span class="chip warn"><span class="spin"></span> 실행 중</span>`
  : r.conclusion === "success" ? `<span class="chip ok">성공</span>`
  : r.conclusion === "cancelled" ? `<span class="chip">취소</span>` : `<span class="chip bad">실패</span>`;
const statusChip = s => /^체결/.test(s) ? `<span class="chip ok">${esc(s)}</span>`
  : /^(주문됨|승인)/.test(s) ? `<span class="chip warn">${esc(s)}</span>`
  : /^(실패|건너뜀|미체결)/.test(s) ? `<span class="chip bad">${esc(s)}</span>` : `<span class="chip">${esc(s)}</span>`;

let MODE = null;
async function loadMode(){
  try {
    const cfg = await raw("config.yaml") || "";
    const m = cfg.match(/^\s*mode:\s*(\w+)/m);
    MODE = m ? m[1] : "paper";
    const el = $("#mode"); el.textContent = MODE === "real" ? "실전투자" : "모의투자"; el.className = "mode" + (MODE === "real" ? " real" : "");
  } catch { $("#mode").textContent = "연결 안 됨"; }
}
const modeName = () => MODE === "real" ? "실전투자" : "모의투자";

// ---------------------------------------------------------------- 화면: 오늘 추천
async function viewToday(v){
  v.innerHTML = loading();
  const [picks, file] = await Promise.all([json("results/latest_picks.json"), latest("results", "추천_")]);
  const today = kstToday();
  if (!picks) { v.innerHTML = `<div class="empty">아직 추천 파일이 없습니다.<br>평일 06:40 이후 다시 확인하세요.</div>`; return; }
  const isToday = picks.entry === today;
  let h = `<div class="row"><div><div class="name">${fmtDate(picks.entry)} 매수용</div>
    <div class="small muted">기준일 ${fmtDate(picks.base)} 시세 · 생성 ${esc(picks.created.slice(5, 16))}</div></div></div>`;
  if (!isToday) h += `<div class="banner warn">오늘(${fmtDate(today)}) 매수용 추천이 아닙니다. 주문 승인은 오늘 매수용 추천에만 할 수 있습니다.</div>`;
  if (!picks.picks.length) h += `<div class="card empty">오늘은 조건을 만족하는 종목이 없습니다.</div>`;
  for (const p of picks.picks) {
    const act = p.us_action === "하향" ? `<span class="chip warn">미국 산업군 하락 → 매수가 하향</span>` : "";
    h += `<label class="card check"><input type="checkbox" class="pick" value="${esc(p.ticker)}" ${isToday ? "checked" : "disabled"}>
      <div style="flex:1;min-width:0"><div class="row"><span class="name">${esc(p.name)}</span><span class="small muted">${esc(p.ticker)}</span></div>
      <div class="small muted">${esc(p.industry || "")} ${act}</div>
      <div class="grid num">
        <div><span>매수가</span><b>${won(p.buy)}</b></div><div><span>수량</span><b>${won(p.qty)}주</b></div>
        <div><span>익절</span><span class="up">${won(p.target)}</span></div><div><span>손절</span><span class="down">${won(p.stop)}</span></div>
        <div><span>종가</span><span>${won(p.close)}</span></div><div><span>금액</span><span>${won(p.buy * p.qty)}</span></div>
      </div></div></label>`;
  }
  if (picks.picks.length) h += `<button class="btn" id="approve" ${isToday ? "" : "disabled"}>선택한 종목 주문 승인</button>
    <p class="small muted">08:30 전에 승인하면 08:31에, 장중이면 바로 지정가 매수 주문이 나갑니다. 익절·손절은 체결 뒤 한국투자 앱 자동감시주문으로 등록하세요.</p>`;
  if (file) h += `<details class="card"><summary>결과 파일 전체 (${esc(file.name)})</summary><pre id="fulltext" class="small" style="margin-top:8px">${loading()}</pre></details>`;
  v.innerHTML = h;
  if (file) v.querySelector("details").addEventListener("toggle", async e => {
    if (e.target.open && !e.target.dataset.loaded) { e.target.dataset.loaded = 1; $("#fulltext").textContent = await raw("results/" + file.name); }
  });
  const btn = $("#approve"); if (!btn) return;
  const upd = () => { const n = v.querySelectorAll(".pick:checked").length; btn.disabled = !isToday || !n; btn.textContent = n ? `선택한 ${n}종목 주문 승인` : "종목을 고르세요"; };
  v.querySelectorAll(".pick").forEach(c => c.addEventListener("change", upd)); upd();
  btn.onclick = async () => {
    const sel = [...v.querySelectorAll(".pick:checked")].map(c => c.value);
    const rows = picks.picks.filter(p => sel.includes(p.ticker));
    const total = rows.reduce((s, p) => s + p.buy * p.qty, 0);
    const ok = await confirmBox(`<div class="name" style="margin-bottom:6px">${modeName()} 매수 승인</div>
      ${rows.map(p => `<div class="row small num"><span>${esc(p.name)}</span><span>${won(p.qty)}주 × ${won(p.buy)}원</span></div>`).join("")}
      <div class="row num" style="margin-top:8px;font-weight:700"><span>합계</span><span>${won(total)}원</span></div>
      <p class="small muted">지정가 주문이며, 계좌 상황에 따라 수량이 줄거나 건너뛸 수 있습니다.</p>`, "승인");
    if (!ok) return;
    btn.disabled = true; btn.innerHTML = `<span class="spin"></span> 보내는 중`;
    try {
      await dispatch("order.yml", {tickers: sel.join(",")});
      store.set("watch_order", String(Date.now()));
      go("orders");
    } catch (e) { btn.disabled = false; upd(); v.insertAdjacentHTML("afterbegin", errorCard(e)); }
  };
}

// ---------------------------------------------------------------- 화면: 주문
async function viewOrders(v){
  v.innerHTML = loading();
  const today = kstToday();
  const [state, rs] = await Promise.all([json(`results/orders/주문_${today}.json`), runs("order.yml", 5)]);
  let h = `<div class="name">${fmtDate(today)} 주문</div>`;
  const active = rs.find(r => r.status !== "completed");
  if (active) h += `<div class="banner warn"><span class="spin"></span> 주문 처리 중 (${ago(active.created_at)} 요청). 자동으로 새로고침합니다.</div>`;
  else if (rs[0] && rs[0].conclusion === "failure") h += `<div class="banner bad">최근 주문 실행이 실패했습니다. 실행 탭에서 확인하세요.</div>`;
  if (!state || !state.orders.length) h += `<div class="card empty">오늘 승인한 주문이 없습니다.</div>`;
  else {
    h += `<div class="card list">` + state.orders.map(o => `<div>
      <div class="row"><span class="name">${esc(o.name)}</span>${statusChip(o.status)}</div>
      <div class="small muted num">${esc(o.ticker)} · ${won(o.ordered_qty ?? o.qty)}주 × ${won(o.buy)}원 · 승인 ${esc(o.approved || "")}${o.ordered ? " · 주문 " + esc(o.ordered) : ""}</div>
    </div>`).join("") + `</div>
    <p class="small muted">${state.mode === "real" ? "실전투자" : "모의투자"} · 체결 여부는 15:45 계좌 동기화 때 반영됩니다. 지금 확인하려면 계좌 탭의 '지금 동기화'를 누르세요.</p>`;
  }
  h += `<button class="btn ghost" onclick="render()">새로고침</button>`;
  v.innerHTML = h;
  const since = +store.get("watch_order") || 0;
  if (active || Date.now() - since < 90000) {   // 방금 승인했으면 실행이 잡힐 때까지 기다린다
    clearTimeout(window._poll); window._poll = setTimeout(() => current === "orders" && render(), 8000);
  }
}

// ---------------------------------------------------------------- 화면: 계좌
async function viewAccount(v){
  v.innerHTML = loading();
  const [file, csv, rs, perf] = await Promise.all([latest("results", "계좌_"), raw("holdings.csv"), runs("sync.yml", 3), latest("results", "성과_")]);
  const hold = parseCsv(csv);
  const active = rs.find(r => r.status !== "completed");
  let h = "";
  if (active) h += `<div class="banner warn"><span class="spin"></span> 동기화 중 (${ago(active.created_at)} 요청)</div>`;
  h += `<div class="card"><div class="row"><span class="name">보유 종목</span><span class="chip">${hold.length}종목</span></div>`;
  h += hold.length ? `<table class="num"><tr><th>종목</th><th>수량</th><th>매수가</th></tr>` +
      hold.map(x => `<tr><td>${esc(x.name)}<div class="small muted">${esc(x.ticker)} · ${fmtDate(x.buy_date)} 매수</div></td><td>${won(x.qty)}</td><td>${won(x.buy_price)}</td></tr>`).join("") + `</table>`
    : `<div class="empty">보유 종목 없음</div>`;
  h += `</div>`;
  if (file) { const t = await raw("results/" + file.name); h += `<div class="card"><div class="small muted" style="margin-bottom:6px">${esc(file.name)}</div><pre>${esc(t)}</pre></div>`; }
  else h += `<div class="card empty">아직 계좌 리포트가 없습니다.</div>`;
  if (perf) { const t = await raw("results/" + perf.name); h += `<details class="card"><summary>주간 성과 (${esc(perf.name)})</summary><pre style="margin-top:8px">${esc(t)}</pre></details>`; }
  h += `<button class="btn" id="sync" ${active ? "disabled" : ""}>지금 동기화</button>
    <p class="small muted">평일 15:45에 자동으로 동기화합니다. 수동 동기화는 1분 정도 걸립니다.</p>`;
  v.innerHTML = h;
  $("#sync").onclick = async e => {
    e.target.disabled = true; e.target.innerHTML = `<span class="spin"></span> 요청 중`;
    try { await dispatch("sync.yml"); setTimeout(render, 4000); } catch (err) { v.insertAdjacentHTML("afterbegin", errorCard(err)); }
  };
  if (active) { clearTimeout(window._poll); window._poll = setTimeout(() => current === "account" && render(), 10000); }
}

// ---------------------------------------------------------------- 화면: 실행
const WF = {"daily.yml": "아침 추천", "order.yml": "주문 승인", "sync.yml": "계좌 동기화", "backtest.yml": "백테스트", "trade.yml": "매수·매도 기록", "krx-check.yml": "접속 시험"};
async function viewRuns(v){
  v.innerHTML = loading();
  const rs = await runs(null, 15);
  let h = `<div class="card list">` + (rs.length ? rs.map(r => {
    const wf = (r.path || "").split("/").pop();
    return `<div><div class="row"><span>${esc(WF[wf] || r.name)}</span>${runChip(r)}</div>
      <div class="small muted">${ago(r.created_at)} · ${r.event === "schedule" ? "자동" : "수동"} · <a href="${esc(r.html_url)}" target="_blank" rel="noopener">자세히</a></div></div>`;
  }).join("") : `<div class="empty">실행 기록 없음</div>`) + `</div>`;
  h += `<button class="btn ghost" id="rerun">추천 다시 실행</button><button class="btn ghost" id="bt">3년 백테스트 실행</button>
    <button class="btn ghost" onclick="render()">새로고침</button>`;
  v.innerHTML = h;
  $("#rerun").onclick = async () => {
    if (!await confirmBox(`<div class="name">추천 다시 실행</div><p class="small muted">가장 최근 거래일 기준으로 추천을 새로 만듭니다. 2~3분 걸립니다.</p>`, "실행")) return;
    try { await dispatch("daily.yml"); setTimeout(render, 4000); } catch (e) { v.insertAdjacentHTML("afterbegin", errorCard(e)); }
  };
  $("#bt").onclick = async () => {
    if (!await confirmBox(`<div class="name">3년 백테스트</div><p class="small muted">10분~1시간 걸립니다. 결과는 results/backtest/ 에 올라옵니다.</p>`, "실행")) return;
    try { await dispatch("backtest.yml"); setTimeout(render, 4000); } catch (e) { v.insertAdjacentHTML("afterbegin", errorCard(e)); }
  };
}

// ---------------------------------------------------------------- 화면: 설정
function viewSettings(v){
  const has = !!token();
  v.innerHTML = `<div class="card"><div class="name">GitHub 토큰</div>
    <p class="small muted">앱이 ${esc(REPO)} 저장소의 결과를 읽고 주문 승인을 실행하는 데 씁니다. 이 휴대폰에만 저장됩니다.</p>
    <input type="password" id="tok" placeholder="${has ? "저장됨 — 바꾸려면 새로 입력" : "github_pat_로 시작하는 토큰"}" autocomplete="off">
    <div style="height:8px"></div><button class="btn" id="save">저장하고 연결 확인</button>
    ${has ? `<button class="btn ghost" id="del">토큰 지우기</button>` : ""}<div id="msg"></div></div>
    ${has ? `<div class="card" id="pushCard">${loading("알림 상태 확인 중")}</div>` : ""}
    <details class="card" ${has ? "" : "open"}><summary>토큰 만드는 법</summary><ol class="steps small">
      <li>휴대폰 브라우저로 github.com 로그인 → 오른쪽 위 프로필 → Settings</li>
      <li>맨 아래 Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token</li>
      <li>이름: 종목추천 앱, 만료: 1년(또는 원하는 기간)</li>
      <li>Repository access: <b>Only select repositories</b> → <b>stock-pick</b> 하나만</li>
      <li>Permissions → Repository permissions: <b>Actions: Read and write</b>, <b>Contents: Read-only</b> (Metadata는 자동)</li>
      <li>Generate token → 복사해서 위 칸에 붙여넣기</li></ol>
      <p class="small muted">이 토큰으로는 코드를 바꿀 수 없고, 결과 읽기와 정해진 실행 버튼만 누를 수 있습니다. 휴대폰을 잃어버리면 GitHub에서 토큰을 삭제하세요.</p></details>
    <p class="small muted" style="text-align:center">모드: ${modeName()} · 저장소 ${esc(REPO)}</p>`;
  $("#save").onclick = async () => {
    const t = $("#tok").value.trim(); if (t) store.set("gh_token", t);
    $("#msg").innerHTML = loading("연결 확인 중");
    try {
      const r = await gh(""); if (r.status === 404) throw new ApiError(404, "저장소를 찾지 못했습니다. 토큰의 Repository access 에 stock-pick 이 있는지 확인하세요.");
      await runs(null, 1);
      $("#msg").innerHTML = `<div class="banner">연결됐습니다.</div>`; await loadMode(); setTimeout(() => go("today"), 600);
    } catch (e) { $("#msg").innerHTML = errorCard(e); }
  };
  const del = $("#del"); if (del) del.onclick = () => { store.set("gh_token", null); render(); };
  if (has) pushCard($("#pushCard"));
}

// ---------------------------------------------------------------- 알림 (Web Push)
const EVENTS = [["picks", "매수용 추천 완료", true], ["holding", "보유 종목 경고 (익절·손절 도달, 시간 청산)", true],
  ["order", "주문 결과", true], ["fill", "체결·청산 (계좌 동기화)", true], ["failure", "작업 실패", true], ["weekly", "주간 성과 리포트", true], ["backtest", "백테스트 완료", false]];
function savedEvents(){
  try { const v = JSON.parse(store.get("push_events")); if (Array.isArray(v)) return v; } catch {}
  return EVENTS.filter(e => e[2]).map(e => e[0]);
}
const b64u = s => { const p = "=".repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function pushSub(){ const reg = await navigator.serviceWorker.ready; return [reg, await reg.pushManager.getSubscription()]; }
async function pushCard(el){
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
    el.innerHTML = `<div class="name">알림</div><p class="small muted">이 브라우저는 알림을 지원하지 않습니다. 안드로이드 Chrome에서 '앱 설치'로 설치해 여세요.</p>`; return;
  }
  let sub = null; try { [, sub] = await pushSub(); } catch {}
  const perm = Notification.permission, on = !!sub && perm === "granted" && store.get("push_on") === "1";
  const chosen = new Set(savedEvents());
  el.innerHTML = `<div class="row"><span class="name">알림</span><span class="chip ${on ? "ok" : ""}">${on ? "켜짐" : "꺼짐"}</span></div>
    <p class="small muted">고른 일이 생기면 이 휴대폰으로 알려 드립니다.</p>
    ${EVENTS.map(([k, label]) => `<label class="check" style="padding:6px 0"><input type="checkbox" class="ev" value="${k}" ${chosen.has(k) ? "checked" : ""}><span>${label}</span></label>`).join("")}
    ${perm === "denied" ? `<div class="banner bad">알림이 차단돼 있습니다. 휴대폰 설정 → 앱 → 종목추천(또는 Chrome) → 알림에서 허용한 뒤 다시 여세요.</div>` : ""}
    <div style="height:8px"></div>
    <button class="btn" id="pushSave" ${perm === "denied" ? "disabled" : ""}>${on ? "알림 설정 저장" : "알림 켜기"}</button>
    ${on ? `<button class="btn ghost" id="pushTest">시험 알림 보내기</button><button class="btn ghost" id="pushOff">알림 끄기</button>` : ""}
    <div id="pushMsg"></div>`;
  const msg = h => { $("#pushMsg").innerHTML = h; };
  const events = () => [...el.querySelectorAll(".ev:checked")].map(c => c.value);
  $("#pushSave").onclick = async () => {
    const ev = events(); if (!ev.length) { msg(`<div class="banner warn">알림 받을 일을 하나 이상 고르세요.</div>`); return; }
    msg(loading("알림 등록 중"));
    try {
      if (await Notification.requestPermission() !== "granted") { msg(`<div class="banner bad">알림 권한을 허용해야 합니다.</div>`); return; }
      const key = ((await raw("notify/vapid_public.txt")) || "").trim();
      if (!key) {
        await dispatch("notify.yml", {action: "init"});
        msg(`<div class="banner warn">알림을 처음 준비하고 있습니다. 1분쯤 뒤 다시 '알림 켜기'를 눌러 주세요.</div>`); return;
      }
      const [reg, old] = await pushSub();
      const s = old || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64u(key)});
      const dev = (navigator.userAgentData && navigator.userAgentData.platform) || "휴대폰";
      await dispatch("notify.yml", {action: "subscribe", subscription: JSON.stringify(s.toJSON()), events: ev.join(","), device: dev});
      store.set("push_on", "1"); store.set("push_events", JSON.stringify(ev));
      msg(`<div class="banner">등록을 요청했습니다. 1분쯤 뒤 '알림이 켜졌습니다' 알림이 오면 완료입니다.</div>`);
      setTimeout(() => current === "settings" && pushCard(el), 2500);
    } catch (e) { msg(errorCard(e)); }
  };
  const t = $("#pushTest"); if (t) t.onclick = async () => {
    try { const [, s] = await pushSub(); await dispatch("notify.yml", {action: "test", subscription: JSON.stringify(s.toJSON())});
      msg(`<div class="banner">시험 알림을 요청했습니다. 1분 안에 옵니다.</div>`); } catch (e) { msg(errorCard(e)); }
  };
  const off = $("#pushOff"); if (off) off.onclick = async () => {
    try { const [, s] = await pushSub();
      if (s) { await dispatch("notify.yml", {action: "unsubscribe", subscription: JSON.stringify(s.toJSON())}); await s.unsubscribe(); }
      store.set("push_on", null); pushCard(el);
    } catch (e) { msg(errorCard(e)); }
  };
}

// ---------------------------------------------------------------- 탭
const ICON = {
  today: '<path d="M4 19V9m5 10V5m5 14v-7m5 7V8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
  orders: '<path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
  account: '<path d="M3 7h18v12H3zM3 11h18M16 15h2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
  runs: '<path d="M12 4a8 8 0 1 0 8 8M12 8v4l3 2M20 4v4h-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
  settings: '<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M4.9 19.1 7 17m10-10 2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
};
const VIEWS = {today: ["오늘 추천", "추천", viewToday], orders: ["주문", "주문", viewOrders], account: ["계좌", "계좌", viewAccount],
               runs: ["실행 기록", "실행", viewRuns], settings: ["설정", "설정", viewSettings]};
const urlTab = new URLSearchParams(location.search).get("tab");
let current = (urlTab && urlTab in VIEWS) ? urlTab : (store.get("tab") || "today");
if (urlTab) history.replaceState(null, "", location.pathname);
function go(tab){ current = tab; store.set("tab", tab); render(); window.scrollTo(0, 0); }
async function render(){
  clearTimeout(window._poll);
  if (!token() && current !== "settings") current = "settings";
  $("#nav").innerHTML = Object.entries(VIEWS).map(([k, [, label]]) =>
    `<button ${k === current ? 'aria-current="page"' : ""} onclick="go('${k}')"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${label}</button>`).join("");
  const [title, , fn] = VIEWS[current]; $("#title").textContent = title;
  const v = $("#view");
  try { await fn(v); } catch (e) { v.innerHTML = errorCard(e); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && token()) render(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (token()) loadMode(); else $("#mode").textContent = "연결 전";
render();
</script>
